server {
    listen 80; listen [::]:80;
    server_name static.example.com;
    # Shared ACME webroot — works before the app is deployed, and for every site type.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/beacon-acme;
    default_type "text/plain";
    allow all;
}

    root /home/beacon/static.example.com/public;
    index index.html index.htm;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 365d; add_header Cache-Control "public, immutable"; access_log off; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/static.example.com-access.log;
    error_log  /var/log/nginx/static.example.com-error.log error;
}
