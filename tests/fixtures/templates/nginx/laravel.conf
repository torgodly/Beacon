# ─── Managed by Beacon — site: app.example.com ───
server {
    listen 80; listen [::]:80;
    server_name app.example.com;
    # Shared ACME webroot — works before the app is deployed, and for every site type.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/beacon-acme;
    default_type "text/plain";
    allow all;
}

    root /home/beacon/app.example.com/public;
    index index.php index.html;
    charset utf-8;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;


    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-app-example-com.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/app.example.com-access.log;
    error_log  /var/log/nginx/app.example.com-error.log error;
}
