upstream beacon_spa_example_com {
    server 127.0.0.1:3001;
    keepalive 16;
}
server {
    listen 80; listen [::]:80;
    server_name spa.example.com;
    # Shared ACME webroot — works before the app is deployed, and for every site type.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/beacon-acme;
    default_type "text/plain";
    allow all;
}

    client_max_body_size 100M;

    location /_next/static/ { alias /home/beacon/spa.example.com/.next/static/;
        expires 365d; add_header Cache-Control "public, immutable"; access_log off; }

    location / {
        proxy_pass http://beacon_spa_example_com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s; proxy_connect_timeout 10s; proxy_buffering on;
    }

    access_log /var/log/nginx/spa.example.com-access.log;
    error_log  /var/log/nginx/spa.example.com-error.log error;
}
