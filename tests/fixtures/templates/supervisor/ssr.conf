; ─── Managed by Beacon — do not edit by hand ───
[program:spa-example-com-ssr]
command         = /home/beacon/.beacon/bin/spa.example.com-ssr.sh
directory       = /home/beacon/spa.example.com
user            = beacon
numprocs        = 1
autostart       = true
autorestart     = true
startsecs       = 10
startretries    = 3
stopasgroup     = true
killasgroup     = true
stopsignal      = SIGTERM
stopwaitsecs    = 20
redirect_stderr = true
stdout_logfile  = /var/log/beacon/sites/spa.example.com-ssr.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3
environment     = HOME="/home/beacon",USER="beacon"
