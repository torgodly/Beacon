; ─── Managed by Beacon — do not edit by hand ───
[program:app-example-com-queue]
process_name    = %(program_name)s_%(process_num)02d
command         = /usr/bin/php8.4 /home/beacon/app.example.com/artisan queue:work redis --queue=default,high --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory       = /home/beacon/app.example.com
user            = beacon
numprocs        = 1
autostart       = true
autorestart     = true
startsecs       = 5
stopasgroup     = true
killasgroup     = true
stopsignal      = TERM
stopwaitsecs    = 3600
redirect_stderr = true
stdout_logfile  = /var/log/beacon/sites/app.example.com-queue.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3
environment     = HOME="/home/beacon",USER="beacon"
