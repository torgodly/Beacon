; Managed by Beacon install.sh — panel queue worker.
[program:beacon-panel-worker]
process_name = %(program_name)s_%(process_num)02d
; Connection must match QUEUE_CONNECTION in deploy/env/panel.env — a worker
; polling a different driver than the one jobs are pushed to looks healthy in
; supervisorctl and silently never runs anything.
command = /usr/bin/php${PANEL_PHP} ${PANEL_CURRENT}/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory = ${PANEL_CURRENT}
user = beacon-panel
numprocs = 1
autostart = true
autorestart = true
startsecs = 5
stopasgroup = true
killasgroup = true
stopsignal = SIGTERM
stopwaitsecs = 20
redirect_stderr = true
stdout_logfile = /var/log/beacon/panel-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 3
environment = HOME="/home/beacon-panel",USER="beacon-panel"
