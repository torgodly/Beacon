; Managed by Beacon install.sh — panel queue worker.
[program:beacon-panel-worker]
process_name = %(program_name)s_%(process_num)02d
; No explicit connection: `queue:work` then follows QUEUE_CONNECTION from the
; panel's .env. Naming a driver here is how the worker ends up polling one
; queue while jobs are pushed to another — it looks perfectly healthy in
; supervisorctl and silently runs nothing. It also drifts the moment an
; existing .env is preserved across a re-install.
command = /usr/bin/php${PANEL_PHP} ${PANEL_CURRENT}/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory = ${PANEL_CURRENT}
user = beacon-panel
numprocs = 1
autostart = true
autorestart = true
startsecs = 5
stopasgroup = true
killasgroup = true
stopsignal = SIGTERM
stopwaitsecs = 20
redirect_stderr = true
stdout_logfile = /var/log/beacon/panel-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 3
environment = HOME="/home/beacon-panel",USER="beacon-panel"
