# Managed by Beacon install.sh — global nginx defaults.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;
client_body_timeout 30s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

# ── TLS policy ───────────────────────────────────────────────────────
# Set once here and inherited by every server block, rather than included
# per-vhost from python3-certbot-nginx's options-ssl-nginx.conf — Beacon does
# not install that plugin, because certificates are obtained with
# `certonly --webroot` so certbot never edits nginx config.
#
# Mozilla "intermediate" profile: ECDHE-only, so no ssl_dhparam is needed
# (which also avoids generating one at install time).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Session settings must live at http level: a shared zone declared in more
# than one server block is a duplicate-zone error.
ssl_session_timeout 1d;
ssl_session_cache shared:BeaconTLS:10m;
ssl_session_tickets off;
