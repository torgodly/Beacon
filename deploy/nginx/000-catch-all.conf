# Managed by Beacon install.sh — drop unmatched HTTP/HTTPS requests (Forge-style).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenges must survive the catch-all.
    #
    # On an IP-only install this is the ONLY vhost on :80, and a bare
    # `return 444` drops Let's Encrypt's HTTP-01 validation request along with
    # everything else — so attaching a panel domain could never succeed
    # ("Some challenges have failed"). The challenge is also served here for
    # any site whose vhost does not exist yet, and for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beacon-acme;
        default_type "text/plain";
        allow all;
    }

    # Everything else is still dropped without a response.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
